<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>PSWKT &mdash; tests WebKit</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="wrap header-row">
      <h1>PSWKT <span class="sub">tests WebKit PS5</span></h1>
      <nav class="topnav">
        <a class="navlink active" href="index.html">Accueil</a>
        <a class="navlink" href="tests.html">Categories &amp; test perso</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div id="crash-banner" class="crash-banner" style="display:none"></div>

    <section class="panel hero">
      <div id="ps-hint" class="ps-line"></div>
      <div class="run-bar big">
        <button id="btn-run-all" class="primary big" type="button">&#9654; Tout lancer</button>
        <button id="btn-stop" class="danger" type="button" disabled>Stop</button>
        <button id="btn-options-toggle" class="ghost" type="button">&#9881; Options</button>
      </div>
      <label class="mini-toggle aggr-main"><input id="opt-aggressive" type="checkbox"> <b>Mode agressif</b> &mdash; afficher et choisir les tests qui peuvent figer/planter</label>
      <div id="aggressive-list" class="aggressive-list" style="display:none"></div>
      <div id="options-panel" class="options-panel" style="display:none">
        <div class="options">
          <label>Echeance/test (ms)<input id="opt-timeout" type="number" value="4000" min="100" step="100"></label>
          <label>Memoire (Mo)<input id="opt-memory" type="number" value="64" min="1" step="1"></label>
          <label>Plafond iterations<input id="opt-maxiter" type="number" value="5000000" min="1000" step="1000"></label>
        </div>
        <label class="mini-toggle"><input id="opt-stream" type="checkbox"> Enregistrement serveur continu (local, optionnel)</label>
      </div>
      <div class="progress">
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        <div id="progress-text" class="progress-text">pret</div>
      </div>
      <div id="summary" class="summary"></div>
    </section>

    <section class="panel">
      <div class="results-filter">
        <input id="result-search" type="text" placeholder="Rechercher un resultat..." spellcheck="false">
        <label><input id="filter-pass" type="checkbox" checked> reussis</label>
        <label><input id="filter-fail" type="checkbox" checked> echecs</label>
        <label><input id="filter-error" type="checkbox" checked> erreurs</label>
        <label><input id="filter-aborted" type="checkbox" checked> arretes</label>
        <label><input id="filter-skip" type="checkbox"> ignores</label>
        <span id="filter-count" class="muted"></span>
      </div>
      <div id="results" class="results"></div>
    </section>

    <section class="panel">
      <div class="log-toolbar">
        <strong class="panel-tag">Console</strong>
        <button id="btn-export-json" class="mini primary" type="button">Export JSON</button>
        <button id="btn-export-text" class="mini ghost" type="button">Export TXT</button>
        <button id="btn-copy-log" class="mini ghost" type="button">Copier</button>
        <button id="btn-download-log" class="mini ghost" type="button">Telecharger .txt</button>
        <button id="btn-clear-log" class="mini ghost" type="button">Vider</button>
        <label class="log-autoscroll"><input id="opt-autoscroll" type="checkbox" checked> defilement auto</label>
      </div>
      <div id="log-console" class="log-console"></div>
      <p id="log-copy-hint" class="muted"></p>
      <textarea id="log-copy-area" class="export-area" readonly spellcheck="false" style="display:none"></textarea>
      <textarea id="export-area" class="export-area" readonly spellcheck="false" style="display:none"></textarea>
      <p id="export-hint" class="muted"></p>
    </section>
  </main>

  <!-- Coeur (ordre important) -->
  <script src="js/core/log.js"></script>
  <script src="js/core/features.js"></script>
  <script src="js/core/guard.js"></script>
  <script src="js/core/runner.js"></script>
  <script src="js/core/export.js"></script>
  <script src="js/core/serverlog.js"></script>
  <script src="js/core/store.js"></script>
  <!-- Tests -->
  <script src="js/tests/typedarrays.js"></script>
  <script src="js/tests/canvas.js"></script>
  <script src="js/tests/objects.js"></script>
  <script src="js/tests/memory.js"></script>
  <script src="js/tests/strings.js"></script>
  <script src="js/tests/numbers.js"></script>
  <script src="js/tests/errors.js"></script>
  <script src="js/tests/async.js"></script>
  <script src="js/tests/platform.js"></script>
  <script src="js/tests/dom.js"></script>
  <script src="js/tests/_factory.js"></script>
  <script src="js/tests/builtins.js"></script>
  <script src="js/tests/globals.js"></script>
  <script src="js/tests/css.js"></script>
  <script src="js/tests/canvas2d_api.js"></script>
  <script src="js/tests/webgl_caps.js"></script>
  <script src="js/tests/media.js"></script>
  <script src="js/tests/input.js"></script>
  <script src="js/tests/syntax.js"></script>
  <script src="js/tests/ps5profile.js"></script>
  <script src="js/tests/_fuzz.js"></script>
  <script src="js/tests/fuzz_parsers.js"></script>
  <script src="js/tests/fuzz_builtins.js"></script>
  <script src="js/tests/fuzz_typedarrays.js"></script>
  <script src="js/tests/fuzz_structural.js"></script>
  <script src="js/tests/fuzz_robustness.js"></script>
  <script src="js/tests/fuzz_robustness2.js"></script>
  <script src="js/tests/fuzz_aggressive.js"></script>
  <script src="js/tests/fuzz_aggressive2.js"></script>
  <!-- Sondes et comportements supplementaires -->
  <script src="js/tests/webapis.js"></script>
  <script src="js/tests/natives_more.js"></script>
  <script src="js/tests/css_more.js"></script>
  <script src="js/tests/syntax_more.js"></script>
  <script src="js/tests/media_more.js"></script>
  <script src="js/tests/webgl_more.js"></script>
  <script src="js/tests/behaviors.js"></script>
  <script src="js/tests/behaviors2.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
